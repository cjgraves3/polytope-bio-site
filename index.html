<style>
  :root {
    --fg: #ffffff;
    --muted: #8a8a8a;
    --bg: #000000;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    width: 100%;
    max-width: 32rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  .tagline {
    margin: 1.25rem 0 0;
    font-size: clamp(1rem, 2.5vw, 1.125rem);
    max-width: 30rem;
  }

  .meta {
    margin: 2.5rem 0 0;
    color: var(--muted);
    font-size: 0.9375rem;
  }

  a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--muted);
    padding-bottom: 1px;
    transition: border-color 120ms ease;
  }

  a:hover, a:focus-visible { border-bottom-color: var(--fg); }

  a:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 3px;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
